# Local MongoDB as a single-node replica set (the API uses transactions, which need a replica set).
# Use: MONGODB_URI=mongodb://localhost:27017/finova?replicaSet=rs0
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30
volumes:
  mongo-data: {}
