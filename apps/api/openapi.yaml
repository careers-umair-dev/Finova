openapi: 3.0.3
info: { title: Finova API, version: 0.5.0, description: "Internal-ledger finance API. No real banking or payment-network integration. Amounts are integer minor units (cents). Cookie auth; every non-GET request needs header X-Requested-With: finova." }
servers: [{ url: /api/v1 }]
components:
  securitySchemes: { cookieAuth: { type: apiKey, in: cookie, name: fv_at } }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Currency: { name: currency, in: query, schema: { type: string, enum: [USD, EUR, GBP, PKR, AED] }, description: "Defaults to your preference. Figures are never mixed across currencies." }
    WalletId: { name: walletId, in: query, schema: { type: string } }
    Tz: { name: tz, in: query, schema: { type: string, default: UTC }, description: IANA timezone for day/month buckets }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
  schemas:
    Error: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string }, details: {} } } } }
    Money: { type: integer, description: Minor units (cents) }
  responses:
    Unauthorized: { description: Not signed in or session revoked, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found (also returned for other users' records), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalid: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security: [{ cookieAuth: [] }]
paths:
  /auth/register: { post: { tags: [Auth], security: [], summary: "Create account and sign in", requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, email, password], properties: { name: { type: string }, email: { type: string }, password: { type: string, minLength: 10, maxLength: 72 } } } } } }, responses: { '201': { description: Created, sets fv_at and fv_rt httpOnly cookies }, '400': { $ref: '#/components/responses/Invalid' }, '409': { description: Email already registered } } } }
  /auth/login: { post: { tags: [Auth], security: [], summary: "Sign in (rate limited)", responses: { '200': { description: OK }, '401': { description: Incorrect email or password } } } }
  /auth/refresh: { post: { tags: [Auth], security: [], summary: "Rotate refresh token (reuse of an old token revokes the session)", responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } } } }
  /auth/logout: { post: { tags: [Auth], security: [], summary: "Revoke current session", responses: { '200': { description: OK } } } }
  /auth/forgot-password: { post: { tags: [Auth], security: [], summary: "Request reset link (always 202)", responses: { '202': { description: Accepted } } } }
  /auth/reset-password: { post: { tags: [Auth], security: [], summary: "Set new password with one-time token; signs out everywhere", responses: { '200': { description: OK }, '400': { description: Invalid or expired token } } } }
  /auth/verify-email: { post: { tags: [Auth], security: [], summary: "Confirm email with one-time token", responses: { '200': { description: OK } } } }
  /me: { get: { tags: [Profile], summary: "Current user", responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } } }, patch: { tags: [Profile], summary: "Update name", responses: { '200': { description: OK } } } }
  /me/password: { post: { tags: [Profile], summary: "Change password; revokes other sessions", responses: { '200': { description: OK } } } }
  /me/preferences: { get: { tags: [Profile], summary: "Get preferences", responses: { '200': { description: OK } } }, patch: { tags: [Profile], summary: "Update theme, locale, currency, notification toggles", responses: { '200': { description: OK } } } }
  /me/sessions: { get: { tags: [Profile], summary: "List active sessions", responses: { '200': { description: OK } } } }
  /me/sessions/{id}: { delete: { tags: [Profile], summary: "Revoke one of your sessions", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } } }
  /wallets: { get: { tags: [Wallets], summary: "List wallets with calculated balances and per-currency totals", parameters: [{ name: includeArchived, in: query, schema: { type: boolean } }], responses: { '200': { description: OK } } }, post: { tags: [Wallets], summary: "Create wallet", requestBody: { content: { application/json: { schema: { type: object, required: [name, currency], properties: { name: { type: string }, currency: { type: string }, openingBalance: { type: string, example: '100.00' } } } } } }, responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Invalid' } } } }
  /wallets/{id}: { get: { tags: [Wallets], summary: "Get wallet", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }, patch: { tags: [Wallets], summary: "Rename, archive, or (before first transaction) change currency/opening balance", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK }, '409': { description: LEDGER_LOCKED } } } }
  /transactions: { get: { tags: [Transactions], summary: "List with filters", parameters: [{ $ref: '#/components/parameters/WalletId' }, { name: contactId, in: query, schema: { type: string } }, { name: type, in: query, schema: { type: string, enum: [income, expense] } }, { name: status, in: query, schema: { type: string, enum: [completed, pending, failed] } }, { name: q, in: query, schema: { type: string } }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { name: sort, in: query, schema: { type: string, enum: [occurredAt, amountMinor] } }, { name: order, in: query, schema: { type: string, enum: [asc, desc] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: OK } } }, post: { tags: [Transactions], summary: "Add internal ledger entry (Send = expense, Receive = income)", description: "Optional Idempotency-Key header (8-100 chars) makes retries safe: a replay returns 200 with Idempotent-Replayed. Expenses exceeding the balance return 422 INSUFFICIENT_FUNDS. Currency always comes from the wallet.", requestBody: { content: { application/json: { schema: { type: object, required: [walletId, type, amount], properties: { walletId: { type: string }, type: { type: string, enum: [income, expense] }, amount: { type: string, example: '25.00' }, status: { type: string, enum: [completed, pending] }, description: { type: string }, category: { type: string }, contactId: { type: string }, occurredAt: { type: string, format: date-time } } } } } }, responses: { '201': { description: Created }, '200': { description: Idempotent replay }, '422': { description: INSUFFICIENT_FUNDS or IDEMPOTENCY_MISMATCH } } } }
  /transactions/export.csv: { get: { tags: [Transactions], summary: "CSV export (same filters as list, max 5000 rows)", responses: { '200': { description: text/csv } } } }
  /transactions/{id}: { get: { tags: [Transactions], summary: "Get one", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } } }, patch: { tags: [Transactions], summary: "Edit description/category/contact or complete/fail a pending entry. Amount, wallet, type and date are immutable.", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK }, '409': { description: INVALID_TRANSITION }, '422': { description: INSUFFICIENT_FUNDS } } } }
  /dashboard/summary: { get: { tags: [Dashboard], summary: "Balance, range income/expense, weekly income vs previous week, daily balance trend", parameters: [{ $ref: '#/components/parameters/Currency' }, { $ref: '#/components/parameters/WalletId' }, { $ref: '#/components/parameters/Tz' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }], responses: { '200': { description: "OK. hasData=false for accounts with no wallets (render empty state)." } } } }
  /dashboard/activity: { get: { tags: [Dashboard], summary: "Six-bucket bar chart data with change vs previous bucket and peakIndex", parameters: [{ name: period, in: query, schema: { type: string, enum: [monthly, annual], default: monthly } }, { $ref: '#/components/parameters/Currency' }, { $ref: '#/components/parameters/WalletId' }, { $ref: '#/components/parameters/Tz' }], responses: { '200': { description: OK } } } }
  /reports/cash-flow: { get: { tags: [Reports], summary: "Totals, monthly series, category breakdown, top counterparties, status counts, comparison with the previous equal-length period", parameters: [{ $ref: '#/components/parameters/Currency' }, { $ref: '#/components/parameters/WalletId' }, { $ref: '#/components/parameters/Tz' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }], responses: { '200': { description: OK } } } }
  /reports/cash-flow.csv: { get: { tags: [Reports], summary: "Monthly series as CSV", responses: { '200': { description: text/csv } } } }
  /reports/compare: { get: { tags: [Reports], summary: "This year vs last year by month", parameters: [{ $ref: '#/components/parameters/Currency' }, { $ref: '#/components/parameters/WalletId' }, { $ref: '#/components/parameters/Tz' }], responses: { '200': { description: OK } } } }
  /contacts: { get: { tags: [Contacts], summary: "Search and list", parameters: [{ name: q, in: query, schema: { type: string } }, { name: includeArchived, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: OK } } }, post: { tags: [Contacts], summary: "Create", responses: { '201': { description: Created } } } }
  /contacts/{id}: { get: { tags: [Contacts], summary: "Detail with per-currency ledger totals", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK } } }, patch: { tags: [Contacts], summary: "Edit, archive (archived true) or restore", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK } } } }
  /documents: { get: { tags: [Documents], summary: "List (never exposes storage keys)", parameters: [{ name: q, in: query, schema: { type: string } }, { name: category, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: OK } } }, post: { tags: [Documents], summary: "Upload. Body = raw file bytes (application/pdf, image/png, image/jpeg; 5 MB max; magic bytes verified). Metadata via query ?name=...&category=...", parameters: [{ name: name, in: query, required: true, schema: { type: string } }, { name: category, in: query, schema: { type: string, enum: [invoice, receipt, statement, contract, other] } }], responses: { '201': { description: Created }, '413': { description: Too large }, '415': { description: Unsupported or mismatched type } } } }
  /documents/{id}/download: { get: { tags: [Documents], summary: "Download (or ?inline=true to preview)", parameters: [{ $ref: '#/components/parameters/Id' }, { name: inline, in: query, schema: { type: boolean } }], responses: { '200': { description: File }, '404': { $ref: '#/components/responses/NotFound' } } } }
  /documents/{id}: { patch: { tags: [Documents], summary: "Rename or recategorise", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK } } }, delete: { tags: [Documents], summary: "Delete record and file", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK } } } }
  /notifications: { get: { tags: [Notifications], summary: "List with unreadCount", parameters: [{ name: unreadOnly, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }], responses: { '200': { description: OK } } } }
  /notifications/read-all: { post: { tags: [Notifications], summary: "Mark all read", responses: { '200': { description: OK } } } }
  /notifications/{id}/read: { patch: { tags: [Notifications], summary: "Mark one read", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK } } } }
